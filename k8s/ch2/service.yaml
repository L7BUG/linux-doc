apiVersion: v1
kind: Service
metadata:
  name: my-app-service
spec:
  type: NodePort           # 本地测试用 NodePort
  selector:
    app: my-app            # 找带 app=my-app 标签的 Pod
  ports:
    - port: 80               # Service 端口（集群内访问）
      targetPort: 80         # Pod 的端口
      nodePort: 30080        # 节点暴露的端口（30000-32767）
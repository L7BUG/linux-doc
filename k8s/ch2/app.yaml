# app.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-java-app
  labels:
    app: my-java-app
spec:
  replicas: 5
  selector:
    matchLabels:
      app: my-java-app
  template:
    metadata:
      labels:
        app: my-java-app
    spec:
      containers:
        - name: my-java-app
          image: l7bug/k8s-java-demo:0.0.2-SNAPSHOT      # 你的镜像
          ports:
            - containerPort: 10086
          resources:                      # 限制资源（后面第4章详细讲）
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          env:                            # 环境变量
            - name: SERVER_PORT
              value: "10086"
---
apiVersion: v1
kind: Service
metadata:
  name: my-java-app-service
spec:
  type: NodePort
  selector:
    app: my-java-app
  ports:
    - port: 80
      targetPort: 10086
      nodePort: 30086
# K3s Docker Compose 配置
# 用于开发机上通过 Docker 运行 K3s Server + Agent
#
# 使用方法：
#   1. 复制 .env.example 为 .env，修改里面的 IP 和 TOKEN
#   2. docker compose up -d
#   3. docker compose logs -f k3s-server  # 等待启动完成
#   4. docker cp k3s-server:/etc/rancher/k3s/k3s.yaml ~/.kube/config
#   5. 修改 kubeconfig 中的 server 地址为 Tailscale IP
#
# 停止/启动：
#   docker compose stop     # 停止（保留数据）
#   docker compose start    # 启动
#   docker compose down -v  # 销毁（删除数据，谨慎！）

services:
  k3s-server:
    image: rancher/k3s:latest
    container_name: k3s-server
    hostname: ${K3S_HOSTNAME:-k3s-server}
    privileged: true
    restart: unless-stopped
    networks:
      - k3s-net
    ports:
      - "6443:6443"
    volumes:
      - k3s-server-data:/var/lib/rancher/k3s
      - /dev/net/tun:/dev/net/tun
    environment:
      - K3S_TOKEN=${K3S_TOKEN}
    command: server ${K3S_SERVER_FLAGS}
    healthcheck:
      test: ["CMD", "k3s", "etcd-snapshot", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  k3s-agent:
    image: rancher/k3s:latest
    container_name: k3s-agent
    hostname: ${K3S_AGENT_HOSTNAME:-k3s-agent}
    privileged: true
    restart: unless-stopped
    networks:
      - k3s-net
    depends_on:
      k3s-server:
        condition: service_healthy
    volumes:
      - k3s-agent-data:/var/lib/rancher/k3s
      - /dev/net/tun:/dev/net/tun
    environment:
      - K3S_TOKEN=${K3S_TOKEN}
    command: agent --server https://${K3S_SERVER_IP}:6443 ${K3S_AGENT_FLAGS}

networks:
  k3s-net:
    driver: bridge

volumes:
  k3s-server-data:
  k3s-agent-data:

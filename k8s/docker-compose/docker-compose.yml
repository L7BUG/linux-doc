# K3s Docker Compose 配置
# 用于开发机上通过 Docker 运行 K3s Agent
#
# 使用方法：
#   1. 复制 .env.company 或 .env.home 为 .env
#   2. 修改 .env 中的 Tailscale IP
#   3. docker compose up -d
#
# 集群 leader 是云服务器 B（sv1），开发机作为 Agent 加入。
#
# 网络模式用 host（共享宿主机网络）：
#   1. 容器内需要解析 Tailscale 主机名
#   2. K3s 需要直接访问宿主机网卡（Flannel 通信）
#
# 停止/启动：
#   docker compose stop     # 停止（保留数据）
#   docker compose start    # 启动
#   docker compose down -v  # 销毁（删除数据，谨慎！）

services:
  k3s-agent:
    image: rancher/k3s:v1.36.4-k3s1
    container_name: k3s-agent
    hostname: ${K3S_HOSTNAME:-k3s-agent}
    privileged: true
    restart: unless-stopped
    network_mode: host
    volumes:
      - k3s-agent-data:/var/lib/rancher/k3s
      - /dev/net/tun:/dev/net/tun
      - ./registries.yaml:/etc/rancher/k3s/registries.yaml
    environment:
      - K3S_TOKEN=${K3S_TOKEN}
      - K3S_URL=${K3S_URL}
    command: agent --node-ip=${NODE_IP}

volumes:
  k3s-agent-data:

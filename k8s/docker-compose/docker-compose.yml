# K3s Docker Compose 配置
# 用于开发机上通过 Docker 运行 K3s Server + Agent
#
# 使用方法：
#   1. 复制 .env.company 或 .env.home 为 .env
#   2. 修改 .env 中的 Tailscale 节点名
#   3. docker compose up -d
#   4. docker compose logs -f k3s-server（等待启动完成）
#   5. docker cp k3s-server:/etc/rancher/k3s/k3s.yaml ~/.kube/config
#   6. 修改 kubeconfig 中的 127.0.0.1 为 Tailscale 节点名
#
# 公司开发机 = 第一个 server（--cluster-init）
# 家里开发机 = 第二个 server（--server 加入）
#
# Tailscale 节点名可以直接用，MagicDNS 会自动解析。
# 例如节点名是 pc1，直接写 pc1 就行，不用记 IP。
#
# 网络模式用 host（共享宿主机网络），原因：
#   1. 容器内需要解析 Tailscale MagicDNS（pc1, pc2 等）
#   2. K3s 需要直接访问宿主机网卡（Flannel/etcd 通信）
#   3. host 网络性能最好，没有 Docker NAT 开销
#
# 停止/启动：
#   docker compose stop     # 停止（保留数据）
#   docker compose start    # 启动
#   docker compose down -v  # 销毁（删除数据，谨慎！）

services:
  k3s-server:
    image: rancher/k3s:latest
    container_name: k3s-server
    hostname: ${K3S_HOSTNAME:-k3s-server}
    privileged: true
    restart: unless-stopped
    network_mode: host
    volumes:
      - k3s-server-data:/var/lib/rancher/k3s
      - /dev/net/tun:/dev/net/tun
    environment:
      - K3S_TOKEN=${K3S_TOKEN}
    command: server ${K3S_SERVER_FLAGS}
    healthcheck:
      test: ["CMD-SHELL", "k3s kubectl get nodes 2>/dev/null | grep -q Ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  k3s-agent:
    image: rancher/k3s:latest
    container_name: k3s-agent
    hostname: ${K3S_AGENT_HOSTNAME:-k3s-agent}
    privileged: true
    restart: unless-stopped
    network_mode: host
    depends_on:
      k3s-server:
        condition: service_healthy
    volumes:
      - k3s-agent-data:/var/lib/rancher/k3s
      - /dev/net/tun:/dev/net/tun
    environment:
      - K3S_TOKEN=${K3S_TOKEN}
    command: agent --server https://${K3S_SERVER_HOST:-localhost}:6443 --node-ip=${K3S_NODE_IP} ${K3S_AGENT_FLAGS}

volumes:
  k3s-server-data:
  k3s-agent-data:

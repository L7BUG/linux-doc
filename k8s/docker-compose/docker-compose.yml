# K3s Docker Compose 配置
# 用于开发机上通过 Docker 运行 K3s Server（自带 Agent 功能）
#
# 使用方法：
#   1. 复制 .env.company 或 .env.home 为 .env
#   2. 修改 .env 中的 Tailscale IP
#   3. docker compose up -d
#   4. docker compose logs -f（等待启动完成）
#   5. docker cp k3s-server:/etc/rancher/k3s/k3s.yaml ~/.kube/config
#   6. 修改 kubeconfig 中的 127.0.0.1 为 Tailscale IP
#
# K3s server 自带 agent 功能，不需要单独跑 agent 容器。
#
# 网络模式用 host（共享宿主机网络）：
#   1. 容器内需要解析 Tailscale 主机名
#   2. K3s 需要直接访问宿主机网卡（Flannel/etcd 通信）
#
# 停止/启动：
#   docker compose stop     # 停止（保留数据）
#   docker compose start    # 启动
#   docker compose down -v  # 销毁（删除数据，谨慎！）

services:
  k3s-server:
    image: rancher/k3s:latest
    container_name: k3s-server
    hostname: ${K3S_HOSTNAME:-k3s-server}
    privileged: true
    restart: unless-stopped
    network_mode: host
    volumes:
      - k3s-server-data:/var/lib/rancher/k3s
      - /dev/net/tun:/dev/net/tun
      - ./registries.yaml:/etc/rancher/k3s/registries.yaml
    environment:
      - K3S_TOKEN=${K3S_TOKEN}
    command: server ${K3S_SERVER_FLAGS}
    healthcheck:
      test: ["CMD-SHELL", "kubectl get nodes | grep -q Ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  k3s-server-data:

# deployment-with-config.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-app-config
data:
  APP_NAME: "L7-BUG-K8S-APP"
---
apiVersion: v1
kind: Secret
metadata:
  name: my-app-secrets
type: Opaque
data:
  USERNAME: "bGx5"
  PASSWORD: "MTIzNDU2"# base64 编码
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-ch2app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-ch2app
  template:
    metadata:
      labels:
        app: my-ch2app
    spec:
      containers:
        - name: my-ch2app
          image: l7bug/k8s-java-demo:0.0.3-SNAPSHOT
          ports:
            - containerPort: 8080
          resources: # 限制资源（后面第4章详细讲）
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          env:
            # 从 ConfigMap 注入
            - name: SPRING_APPLICATION_NAME
              valueFrom:
                configMapKeyRef:
                  name: my-app-config
                  key: APP_NAME
            # 从 Secret 注入
            - name: USERNAME
              valueFrom:
                secretKeyRef:
                  name: my-app-secrets
                  key: USERNAME
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: my-app-secrets
                  key: PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: my-ch2app-service
spec:
  type: NodePort
  selector:
    app: my-ch2app
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080